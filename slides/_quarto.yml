project:
  type: default
  post-render: python ../scripts/bust_cache.py

title: "Applications of AI in Biotechnology and Genomics"
format:
  revealjs:
    width: 1600
    height: 900
    code-overflow: scroll
    code-line-wrapping: true
    title-slide-attributes:
      data-state: "hide-menubar"
    theme: white
    menu: false
    slide-number: c/t
    transition: none
    progress: false
    preview-links: auto
    css: style.css
    include-after-body: todo_menu.html
    logo: assets/logo.png
    toc: true
    toc-depth: 1
    simplemenu:
      flat: true
      barhtml:
          header: "<div class='menubar'><ul class='menu'></ul></div>"
      scale: 0.42

revealjs-plugins:
  - simplemenu

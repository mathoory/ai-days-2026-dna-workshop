<!-- A second menu row under the section menu: one link per TODO slide (slides tagged data-todo). -->
<style>
  .todo-bar { position: fixed; left: 0; right: 0; z-index: 40; display: flex; justify-content: center; gap: 10px;
              pointer-events: none; font-family: Roboto, sans-serif; }
  .todo-bar a { pointer-events: auto; font-size: 12px; line-height: 1; padding: 3px 9px; border-radius: 10px;
                color: #1A73E8; background: #E8F0FE; text-decoration: none; }
  .todo-bar a.active { color: #fff; background: #1A73E8; }
  .todo-bar a:hover { background: #D2E3FC; }
  .todo-bar a.active:hover { background: #1A73E8; }
  .reveal[data-state~="hide-menubar"] ~ .todo-bar, body.hide-todo .todo-bar { display: none; }
</style>
<script>
(function () {
  function build() {
    var slides = Reveal.getSlides(), todos = [];
    slides.forEach(function (s, i) {
      var t = s.getAttribute("data-todo");
      if (t) todos.push({ name: t, index: i });
    });
    if (!todos.length) return;
    var bar = document.createElement("div");
    bar.className = "todo-bar";
    todos.forEach(function (t) {
      var a = document.createElement("a");
      a.href = "#"; a.textContent = t.name;
      a.addEventListener("click", function (e) { e.preventDefault(); Reveal.slide(t.index); });
      t.el = a; bar.appendChild(a);
    });
    document.body.appendChild(bar);
    function place() {
      var mb = document.querySelector(".menubar");
      var r = mb ? mb.getBoundingClientRect() : null;
      bar.style.top = ((r && r.height) ? r.bottom + 4 : 30) + "px";
    }
    function update() {
      var cur = Reveal.getIndices().h;
      var title = Reveal.getCurrentSlide().id === "title-slide";
      document.body.classList.toggle("hide-todo", title);
      todos.forEach(function (t) { t.el.classList.toggle("active", t.index === cur); });
      place();
    }
    Reveal.on("slidechanged", update);
    Reveal.on("resize", place);
    update();
  }
  if (window.Reveal && Reveal.isReady && Reveal.isReady()) build();
  else window.addEventListener("load", function () {
    if (Reveal.isReady()) build(); else Reveal.on("ready", build);
  });
})();
</script>
